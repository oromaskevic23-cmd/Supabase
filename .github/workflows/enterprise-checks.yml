name: IMPERIAL Core | Supabase Enterprise Integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'policies/**'
      - 'ops/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/enterprise-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout read-only repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node.js 24
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 / Node.js 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate enterprise source and SEO
        run: python scripts/validate_repo.py
      - name: Run independent repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
