name: IMPERIAL Core | Supabase Enterprise Integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'policies/**'
      - 'ops/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/enterprise-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout read-only repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate enterprise source and SEO
        run: python scripts/validate_repo.py
      - name: Run independent repository unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
