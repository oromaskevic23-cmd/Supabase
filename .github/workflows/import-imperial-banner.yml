name: Import Supabase IMPERIAL Core banner (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-imperial-banner.yml'
permissions:
  contents: write
jobs:
  import-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Store original generated banner in repository
        env:
          SOURCE_IMAGE_URL: "https://pikaso.cdnpk.net/private/production/5929652365/3819721563.png?token=exp=1793923200~hmac=275a09536635a8e708a4addd89bc7441ce3b6c2f9bbadbf8298a0f812b3d9a08"
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --retry 3 --max-time 60 --silent --show-error "$SOURCE_IMAGE_URL" --output assets/supabase-imperial-core-integration.png
          python3 - <<'PY'
          from pathlib import Path
          image = Path('assets/supabase-imperial-core-integration.png')
          data = image.read_bytes()
          assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), 'The downloaded file is not a PNG'
          assert len(data) > 500000, 'Unexpectedly small image download'
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          image_markdown = '![Supabase × IMPERIAL Core — integration banner](assets/supabase-imperial-core-integration.png)'
          assert text.startswith('# IMPERIAL Core — Supabase Enterprise Infrastructure\n'), 'README header differs; abort without rewriting'
          if image_markdown not in text:
              text = text.replace('# IMPERIAL Core — Supabase Enterprise Infrastructure\n', '# IMPERIAL Core — Supabase Enterprise Infrastructure\n\n' + image_markdown + '\n', 1)
              readme.write_text(text, encoding='utf-8')
          Path('.github/workflows/import-imperial-banner.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/supabase-imperial-core-integration.png .github/workflows/import-imperial-banner.yml
          git commit -m "docs(branding): add original Supabase IMPERIAL Core banner"
          git push
